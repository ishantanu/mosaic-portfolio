apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
          - key: http.route
            value: http_route
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{source="docker", stack="mosaic"} | json | trace_id="$${__trace.traceId}"'
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: Trace ID
          matcherRegex: trace_id
          matcherType: label
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
        - name: Frontend trace ID
          matcherRegex: traceID
          matcherType: label
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
