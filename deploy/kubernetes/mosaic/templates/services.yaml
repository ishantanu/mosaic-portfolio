apiVersion: v1
kind: Service
metadata:
  name: {{ include "mosaic.fullname" . }}-api
  labels: {{- include "mosaic.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "mosaic.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports: [{name: http, port: {{ .Values.api.service.port }}, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mosaic.fullname" . }}-web
  labels: {{- include "mosaic.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "mosaic.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports: [{name: http, port: {{ .Values.web.service.port }}, targetPort: http}]
