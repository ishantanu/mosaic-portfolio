apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mosaic.fullname" . }}-api
  labels: {{- include "mosaic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "mosaic.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "mosaic.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ default .Chart.AppVersion .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          ports: [{name: http, containerPort: 8081}]
          env:
            - {name: PORT, value: "8081"}
            - {name: MOSAIC_DEMO_MODE, value: {{ .Values.api.demoMode | quote }}}
            - {name: TRADING212_ACCOUNT_ID, value: {{ .Values.api.accountID | quote }}}
            - {name: BROKER_REFRESH_INTERVAL, value: {{ .Values.api.brokerRefreshInterval | quote }}}
            - {name: OTEL_SERVICE_NAME, value: {{ .Values.api.otelServiceName | quote }}}
            {{- if .Values.api.corsOrigin }}
            - {name: CORS_ORIGIN, value: {{ .Values.api.corsOrigin | quote }}}
            {{- end }}
            {{- if .Values.api.otelEndpoint }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.api.otelEndpoint | quote }}}
            {{- end }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.api.existingSecret }}, key: {{ .Values.api.secretKeys.databaseURL }}}}
            - name: TRADING212_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.api.existingSecret }}, key: {{ .Values.api.secretKeys.trading212APIKey }}, optional: true}}
            - name: TRADING212_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.api.existingSecret }}, key: {{ .Values.api.secretKeys.trading212SecretKey }}, optional: true}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
