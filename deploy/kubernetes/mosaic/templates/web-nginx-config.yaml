apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosaic.fullname" . }}-web-nginx
  labels: {{- include "mosaic.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / { try_files $uri $uri/ /index.html; }
    }
